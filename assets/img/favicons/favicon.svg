<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 고리 달린 행성 아이콘 (직접 제작) -->
  <defs>
    <clipPath id="ring-back">
      <rect x="0" y="0" width="64" height="32"/>
    </clipPath>
    <clipPath id="ring-front">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
    <clipPath id="planet-shape">
      <circle cx="32" cy="32" r="16"/>
    </clipPath>
  </defs>
  <g transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="#FDCB6E" stroke-width="4" clip-path="url(#ring-back)"/>
    <circle cx="32" cy="32" r="16" fill="#6C5CE7"/>
    <rect x="0" y="23" width="64" height="4" fill="#8E80FF" clip-path="url(#planet-shape)"/>
    <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="#FDCB6E" stroke-width="4" clip-path="url(#ring-front)"/>
  </g>
  <g fill="#FDCB6E">
    <circle cx="11" cy="12" r="1.6"/>
    <circle cx="53" cy="13" r="1.3"/>
    <circle cx="52" cy="52" r="1.6"/>
    <circle cx="9" cy="47" r="1.1"/>
  </g>
</svg>
